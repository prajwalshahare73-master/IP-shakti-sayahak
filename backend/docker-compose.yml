version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ipsakti-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - CHROMA_PATH=/data/chroma
      - BM25_INDEX_PATH=/data/bm25
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=llama3.1
      - LLM_CONCURRENCY_LIMIT=2
      - FRONTEND_ORIGIN=http://localhost:5173
    volumes:
      - chroma_data:/data/chroma
      - bm25_data:/data/bm25
    depends_on:
      - ollama
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  ollama:
    image: ollama/ollama:latest
    container_name: ipsakti-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama

volumes:
  chroma_data:
  bm25_data:
  ollama_models:
