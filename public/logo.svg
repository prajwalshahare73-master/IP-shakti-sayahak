  <!-- Radiant Rays / Knowledge Crown -->
  <circle cx="60" cy="42" r="22" fill="#ffffff" fill-opacity="0.12" />
  
  <!-- Stylized Ayurvedic Sacred Leaf (Left to Center) -->
  <path d="M 60 30 C 42 34 34 50 44 68 C 48 76 56 82 60 86 C 60 74 54 60 60 30 Z" 
