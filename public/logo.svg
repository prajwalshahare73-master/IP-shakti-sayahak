  <!-- Center Spire / Dharma / Shakti Pillar -->
  <path d="M 58 24 L 62 24 L 63 76 L 60 88 L 57 76 Z" fill="#ffffff" />
  <circle cx="60" cy="22" r="3.5" fill="#f59e0b" stroke="#ffffff" stroke-width="1.5" />
  
  <!-- Traditional Knowledge Emblem / Spark -->
  <circle cx="60" cy="52" r="4.5" fill="#ffffff" />
  <circle cx="60" cy="52" r="2.5" fill="#1d5f9f" />
