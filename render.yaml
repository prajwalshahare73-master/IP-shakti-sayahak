services:
  - type: web
    name: ip-sakti-sahayak-backend
    env: docker
    region: singapore
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    envVars:
      - key: APP_ENV
        value: production
      # Absolute paths inside the Docker container (/app is WORKDIR).
      # Required because config.py derives project_root as /app/.. = / inside Docker,
      # which would give the wrong path /data/index/... instead of /app/data/index/...
      - key: BM25_INDEX_PATH
        value: /app/data/index/bm25.pkl
      - key: CHROMA_PATH
        value: /app/data/index/chroma
      - key: FRONTEND_ORIGIN
        value: "*"
      - key: OLLAMA_BASE_URL
        value: http://localhost:11434
      - key: OLLAMA_MODEL
        value: llama3.1
      - key: DISABLE_HEAVY_RERANKER
        value: "true"
      - key: DISABLE_VECTOR_EMBEDDINGS
        value: "true"
