services:
  - type: web
    name: ip-sakti-sahayak-backend
    env: python
    region: singapore
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn src.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: APP_ENV
        value: production
      - key: FRONTEND_ORIGIN
        value: "*"
      - key: OLLAMA_BASE_URL
        value: http://localhost:11434
      - key: OLLAMA_MODEL
        value: llama3.1
      - key: DISABLE_HEAVY_RERANKER
        value: "true"
      - key: DISABLE_VECTOR_EMBEDDINGS
        value: "true"
